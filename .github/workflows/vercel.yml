name: Vercel Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      VERCEL_PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check optional CLI deployment credentials
        id: vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel deploys through the connected Git integration. Optional CLI deployment credentials are not configured."
          fi

      - name: Setup Node
        if: steps.vercel.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.vercel.outputs.configured == 'true'
        run: npm ci

      - name: Pull Vercel environment
        if: steps.vercel.outputs.configured == 'true'
        run: npx vercel@latest pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        if: steps.vercel.outputs.configured == 'true'
        run: npx vercel@latest build $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: steps.vercel.outputs.configured == 'true'
        run: npx vercel@latest deploy --prebuilt $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN"
